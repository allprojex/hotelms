# Nginx server block for the Hotel PMS DEMO — app.infinitytechub.com
#
# Install to  /etc/nginx/sites-available/infinity-pms-demo
# then        ln -s /etc/nginx/sites-available/infinity-pms-demo /etc/nginx/sites-enabled/
#
# This file names ONLY app.infinitytechub.com and proxies ONLY to 127.0.0.1:3200.
# It must never mention theskwoffhotel.com, the apex infinitytechub.com, or
# port 3100. Adding it changes nothing about how any existing host routes:
# nginx selects a server block by server_name, and this name is not currently
# claimed by any other block on this host.
#
# Install this HTTP-only version first, prove it proxies, and let certbot add
# the TLS directives and the redirect itself (see deploy/demo/README.md).
# Hand-writing ssl_certificate paths before the certificate exists makes
# `nginx -t` fail and blocks the reload.

server {
    listen 80;
    listen [::]:80;

    server_name app.infinitytechub.com;

    # Matches the production block. The demo carries gallery images and
    # receipt PDFs, so the default 1m is too small.
    client_max_body_size 25m;

    # Keep the demo out of search results. It is a sales environment with
    # invented data, and it should never compete with the real site or be
    # indexed as though it were a hotel.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
